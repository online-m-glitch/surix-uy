<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --surface-2:#f9fafb; --border:#e3e6ea;
  --text:#0f1720; --text-2:#4b5563; --muted:#8a94a3;
  --brand:#0b5cad; --brand-2:#e8f1fb;
  --s1:#2a78d6; --s2:#eb6834;
  --good:#12805c; --good-bg:#e7f6ef; --warn:#b26a00; --warn-bg:#fff4e0; --bad:#c23b3a; --bad-bg:#fdecec;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111315; --surface:#1a1c1f; --surface-2:#202327; --border:#2d3136;
    --text:#f2f4f6; --text-2:#c3c7cd; --muted:#8b939e;
    --brand:#5aa2ee; --brand-2:#1b2a3b; --s1:#3987e5; --s2:#d95926;
    --good:#4cc796; --good-bg:#15291f; --warn:#f0b04a; --warn-bg:#2d2412; --bad:#f07574; --bad-bg:#2e1718;
  }
}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1c1f; --surface-2:#202327; --border:#2d3136;
  --text:#f2f4f6; --text-2:#c3c7cd; --muted:#8b939e;
  --brand:#5aa2ee; --brand-2:#1b2a3b; --s1:#3987e5; --s2:#d95926;
  --good:#4cc796; --good-bg:#15291f; --warn:#f0b04a; --warn-bg:#2d2412; --bad:#f07574; --bad-bg:#2e1718;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;max-width:1400px;margin:auto}
.logo{font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo span{color:var(--brand)}
.top .sp{flex:1}
.tc-chip{font-size:12px;color:var(--text-2);background:var(--surface-2);border:1px solid var(--border);padding:4px 10px;border-radius:99px;cursor:pointer}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 16px;max-width:1400px;margin:auto;scrollbar-width:none}
nav button{border:0;background:none;padding:10px 12px;color:var(--text-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500}
nav button.on{color:var(--brand);border-color:var(--brand)}
main{max-width:1400px;margin:auto;padding:20px}
h2{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:13px;margin:0 0 10px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--border);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
input,select,textarea{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%}
.row input,.row select{width:auto}
label.f{display:block;font-size:12px;color:var(--text-2);font-weight:500}
label.f>input,label.f>select,label.f>textarea{margin-top:4px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--text-2);font-size:12px;padding:8px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr:hover td{background:var(--surface-2)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.tag.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pos{color:var(--good)} .neg{color:var(--bad)}
.empty{color:var(--muted);text-align:center;padding:24px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;padding:40px 16px;overflow:auto}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:620px;padding:20px;border:1px solid var(--border)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.login{max-width:380px;margin:10vh auto}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:var(--surface);padding:10px 14px;border-radius:8px;z-index:99;max-width:360px}
.chart-box{position:relative;height:260px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.list li{padding:8px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px}
.list{list-style:none;margin:0;padding:0}
.list li>span:last-child{white-space:nowrap;text-align:right}
.list li:last-child{border:0}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--brand-2);color:var(--brand);font-weight:600}
.kanban{display:grid;grid-template-columns:repeat(6,minmax(200px,1fr));gap:10px;overflow-x:auto}
.kcol{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;min-height:120px}
.kcol h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;color:var(--text-2);display:flex;justify-content:space-between}
.kc{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;cursor:pointer;font-size:13px}
.kc b{display:block}
.ro .btn[onclick*="openForm"],.ro .btn[onclick*="openTransfer"],.ro .btn[onclick*="delRow"],.ro .noadmin{display:none!important}
.drop{display:block;border:2px dashed var(--border);border-radius:10px;padding:28px;text-align:center;color:var(--text-2);cursor:pointer}
@media (max-width:640px){main{padding:16px}.top{flex-wrap:wrap;padding:10px 16px}.logo{font-size:14px}#userEmail{display:none}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:18px}.fgrid{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media print{header nav,.btn,.noprint{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>

<div id="loginView" class="hidden">
  <div class="login card">
    <div class="logo" style="font-size:20px;margin-bottom:4px">Surix <span>Uruguay</span></div>
    <p class="sub">Estado de situación · acceso socios</p>
    <label class="f">Email<input id="lgEmail" type="email" autocomplete="username"></label><br>
    <label class="f">Contraseña<input id="lgPass" type="password" autocomplete="current-password"></label><br>
    <div class="row"><button class="btn pri" id="btnLogin">Ingresar</button>
      <button class="btn ghost" id="btnSignup">Crear cuenta</button>
      <button class="btn ghost" id="btnReset">Olvidé la clave</button></div>
    <p class="sub" id="lgMsg" style="margin-top:12px"></p>
  </div>
</div>

<div id="noAccess" class="hidden">
  <div class="login card"><h2>Sin acceso</h2>
  <p class="sub">Tu email (<b id="naEmail"></b>) no está habilitado como socio. Pedile a un socio que te agregue en la pestaña <b>Socios</b>.</p>
  <button class="btn" onclick="logout()">Salir</button></div>
</div>

<div id="app" class="hidden">
<header>
  <div class="top">
    <div class="logo">Surix <span>Uruguay</span> · Estado de situación</div>
    <div class="sp"></div>
    <span class="tc-chip" id="tcChip" title="Tipo de cambio usado para consolidar">TC —</span>
    <button class="btn sm ghost" id="themeBtn" title="Tema">◐</button>
    <span class="muted" id="userEmail" style="font-size:12px"></span>
    <button class="btn sm" onclick="logout()">Salir</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="main"></main>
</div>

<div id="modalRoot"></div>

<script>
// ================= Config =================
const SUPABASE_URL = 'https://gbtjoxedecnkzwponyca.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Jl9-IRiwBelmjDW1ORsRvw_Jlhy8y1h';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const TABS = [
  ['resumen','Resumen'],['bancos','Bancos'],['movimientos','Movimientos'],['clientes','Cta. cte. clientes'],
  ['proveedores','Deuda proveedores'],['stock','Stock'],['oportunidades','Oportunidades'],['socios','Socios'],
  ['importar','Importar Excel'],['config','Configuración']
];
const S = { tab:'resumen', data:{}, tc:null, period:'semana', admin:false };

// ================= Helpers =================
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, cur) => {
  const v = Number(n||0);
  const s = v.toLocaleString('es-UY',{minimumFractionDigits:2,maximumFractionDigits:2});
  return cur ? (cur==='USD'?'US$ ':'$ ')+s : s;
};
const fmt0 = (n, cur) => (cur==='USD'?'US$ ':cur==='UYU'?'$ ':'') + Number(n||0).toLocaleString('es-UY',{maximumFractionDigits:0});
const fdate = d => d ? d.split('-').reverse().join('/') : '';
const today = () => new Date().toISOString().slice(0,10);
const toUSD = (amt, cur) => cur==='USD' ? Number(amt||0) : (S.tc ? Number(amt||0)/S.tc : 0);
function toast(msg, ms=3000){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms); }
function sign(n){ return n>0.004?'pos':n<-0.004?'neg':''; }

async function fetchAll(table, select='*', order='id', asc=false){
  let out=[], from=0, size=1000;
  for(;;){
    let q = sb.from(table).select(select).range(from, from+size-1);
    if(order) q = q.order(order,{ascending:asc});
    const {data, error} = await q;
    if(error){ toast('Error '+table+': '+error.message, 6000); break; }
    out = out.concat(data); if(data.length<size) break; from+=size;
  }
  return out;
}

async function loadAll(){
  const [cuentas,saldos,movs,clientes,proveedores,socios,vsocios,docs,ccc,ccp,productos,vstock,smov,opps,tc] = await Promise.all([
    fetchAll('cuentas','*','nombre',true), fetchAll('v_saldos_cuentas','*','nombre',true),
    fetchAll('movimientos','*, cuentas(nombre,moneda), clientes(nombre), proveedores(nombre), socios(nombre)','fecha',false),
    fetchAll('clientes','*','nombre',true), fetchAll('proveedores','*','nombre',true),
    fetchAll('socios','*','nombre',true), fetchAll('v_socios','*',null),
    fetchAll('documentos','*, clientes(nombre), proveedores(nombre)','fecha',false),
    fetchAll('v_cc_clientes','*','nombre',true), fetchAll('v_cc_proveedores','*','nombre',true),
    fetchAll('productos','*','nombre',true), fetchAll('v_stock','*','nombre',true),
    fetchAll('stock_movimientos','*, productos(sku,nombre)','fecha',false),
    fetchAll('oportunidades','*','actualizado',false), fetchAll('tipo_cambio','*','fecha',false)
  ]);
  S.data = {cuentas,saldos,movs,clientes,proveedores,socios,vsocios,docs,ccc,ccp,productos,vstock,smov,opps,tc};
  S.tc = tc[0] ? Number(tc[0].usd_uyu) : null;
  $('#tcChip').textContent = S.tc ? `TC ${S.tc.toLocaleString('es-UY')} · ${fdate(tc[0].fecha)}` : 'Cargar tipo de cambio';
}

// ================= Auth =================
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ show('loginView'); return; }
  const {data:ok} = await sb.rpc('es_socio');
  if(!ok){ $('#naEmail').textContent = session.user.email; show('noAccess'); return; }
  const {data:adm} = await sb.rpc('es_admin'); S.admin = !!adm;
  document.body.classList.toggle('ro', !S.admin);
  $('#userEmail').innerHTML = esc(session.user.email) + (S.admin ? ' <span class="tag good">Administrador</span>' : ' <span class="tag">Solo lectura</span>');
  show('app'); renderNav(); await refresh();
}
function show(id){ ['loginView','noAccess','app'].forEach(x=>$('#'+x).classList.toggle('hidden', x!==id)); }
async function logout(){ await sb.auth.signOut(); location.reload(); }
$('#btnLogin').onclick = async()=>{
  const {error} = await sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(), password:$('#lgPass').value});
  if(error) $('#lgMsg').textContent = 'No se pudo ingresar: '+error.message; else boot();
};
$('#lgPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#btnLogin').click(); });
$('#btnSignup').onclick = async()=>{
  const email=$('#lgEmail').value.trim(), password=$('#lgPass').value;
  if(!email || password.length<6){ $('#lgMsg').textContent='Ingresá email y una contraseña de al menos 6 caracteres.'; return; }
  const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.href.split('#')[0]}});
  if(error) $('#lgMsg').textContent = error.message;
  else if(data.session) boot();
  else $('#lgMsg').textContent = 'Cuenta creada. Revisá tu email para confirmarla y después ingresá.';
};
$('#btnReset').onclick = async()=>{
  const email=$('#lgEmail').value.trim(); if(!email){ $('#lgMsg').textContent='Escribí tu email primero.'; return; }
  const {error} = await sb.auth.resetPasswordForEmail(email,{redirectTo: location.href.split('#')[0]});
  $('#lgMsg').textContent = error ? error.message : 'Te enviamos un email para restablecer la clave.';
};
sb.auth.onAuthStateChange((ev)=>{ if(ev==='PASSWORD_RECOVERY'){ const p=prompt('Nueva contraseña (mín. 6):'); if(p) sb.auth.updateUser({password:p}).then(()=>toast('Contraseña actualizada')); } });

// theme
(function(){ let t=null; try{t=localStorage.getItem('suy-theme')}catch(e){} if(t) document.documentElement.dataset.theme=t; })();
$('#themeBtn').onclick=()=>{ const cur=document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  const n=cur==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; try{localStorage.setItem('suy-theme',n)}catch(e){} render(); };
$('#tcChip').onclick=()=>{ if(S.admin) openForm('tipo_cambio'); };

// ================= Nav / render =================
function renderNav(){
  $('#nav').innerHTML = TABS.filter(([k])=>S.admin||k!=='importar').map(([k,l])=>`<button data-t="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.t; renderNav(); render(); try{history.replaceState(null,'','#'+S.tab)}catch(e){} });
}
async function refresh(){ await loadAll(); render(); }
let charts=[];
function render(){
  charts.forEach(c=>c.destroy()); charts=[];
  if(!S.admin && S.tab==='importar') S.tab='resumen';
  const f = {resumen:vResumen,bancos:vBancos,movimientos:vMovimientos,clientes:vClientes,proveedores:vProveedores,
    stock:vStock,oportunidades:vOpps,socios:vSocios,importar:vImportar,config:vConfig}[S.tab];
  $('#main').innerHTML = f(); (AFTER[S.tab]||(()=>{}))();
}
const AFTER = {};
function table(cols, rows, empty='Sin datos todavía'){
  if(!rows.length) return `<div class="empty">${empty}</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}">${c.h}</th>`).join('')}</tr></thead><tbody>${
    rows.map(r=>`<tr>${cols.map(c=>`<td class="${c.n?'n':''}">${c.f(r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const actions = (tbl,id) => !S.admin ? '' : `<span class="noprint" style="white-space:nowrap"><button class="btn sm ghost" onclick="openForm('${tbl}',${id})">✎</button><button class="btn sm ghost danger" onclick="delRow('${tbl}',${id})">✕</button></span>`;

// ================= Period helpers =================
function periodRange(p){
  const d=new Date(); d.setHours(0,0,0,0); let from;
  if(p==='semana'){ const w=(d.getDay()+6)%7; from=new Date(d); from.setDate(d.getDate()-w); }
  else if(p==='mes'){ from=new Date(d.getFullYear(), d.getMonth(), 1); }
  else if(p==='anio'){ from=new Date(d.getFullYear(),0,1); }
  else from=new Date(2000,0,1);
  return from.toISOString().slice(0,10);
}
function flows(from){
  const r={UYU:{ingreso:0,pago:0,aporte:0,retiro:0},USD:{ingreso:0,pago:0,aporte:0,retiro:0}};
  S.data.movs.filter(m=>m.fecha>=from).forEach(m=>{ const c=m.cuentas?.moneda; if(r[c] && r[c][m.tipo]!==undefined) r[c][m.tipo]+=Number(m.monto); });
  return r;
}

// ================= Resumen =================
function vResumen(){
  const D=S.data;
  const bank = {UYU:0,USD:0}; D.saldos.filter(s=>s.activa).forEach(s=>bank[s.moneda]+=Number(s.saldo));
  const cons = bank.USD + toUSD(bank.UYU,'UYU');
  const cxc = {UYU:0,USD:0}; D.ccc.forEach(r=>{ if(r.saldo>0) cxc[r.moneda]+=Number(r.saldo); });
  const cxp = {UYU:0,USD:0}; D.ccp.forEach(r=>{ if(r.saldo>0) cxp[r.moneda]+=Number(r.saldo); });
  const stockVal = D.vstock.reduce((a,p)=>a+toUSD(Math.max(0,p.stock)*Number(p.costo||0), p.moneda_costo),0);
  const openOpps = D.opps.filter(o=>!['ganada','perdida'].includes(o.etapa));
  const pipe = openOpps.reduce((a,o)=>a+toUSD(o.monto_estimado,o.moneda),0);
  const pipeW = openOpps.reduce((a,o)=>a+toUSD(o.monto_estimado,o.moneda)*(o.probabilidad||0)/100,0);
  const net = cons + toUSD(cxc.UYU,'UYU')+cxc.USD - (toUSD(cxp.UYU,'UYU')+cxp.USD) + stockVal;
  const from = periodRange(S.period); const fl = flows(from);
  const low = D.vstock.filter(p=>p.activo && Number(p.stock) < Number(p.stock_minimo||0));
  const in30 = new Date(Date.now()+30*864e5).toISOString().slice(0,10);
  const venc = D.docs.filter(d=>d.vencimiento && d.vencimiento<=in30).map(d=>{
      const cc = d.entidad==='cliente' ? D.ccc.find(x=>x.cliente_id===d.cliente_id && x.moneda===d.moneda) : D.ccp.find(x=>x.proveedor_id===d.proveedor_id && x.moneda===d.moneda);
      return {...d, pendiente: cc && cc.saldo>0.004};
    }).filter(d=>d.pendiente).sort((a,b)=>a.vencimiento.localeCompare(b.vencimiento)).slice(0,8);
  const next = openOpps.filter(o=>o.fecha_proximo).sort((a,b)=>a.fecha_proximo.localeCompare(b.fecha_proximo)).slice(0,6);
  const noTC = !S.tc ? `<div class="card" style="border-color:var(--warn);margin-bottom:14px"><b>Falta el tipo de cambio.</b> Cargalo para ver los consolidados en USD. <button class="btn sm" onclick="openForm('tipo_cambio')">Cargar TC</button></div>`:'';
  const P = {semana:'Esta semana',mes:'Este mes',anio:'Este año',todo:'Histórico'};
  const flowRow = (lab, k, cls) => `<tr><td>${lab}</td><td class="n ${cls}">${fmt(fl.UYU[k],'UYU')}</td><td class="n ${cls}">${fmt(fl.USD[k],'USD')}</td></tr>`;
  const netUYU = fl.UYU.ingreso+fl.UYU.aporte-fl.UYU.pago-fl.UYU.retiro, netUSD = fl.USD.ingreso+fl.USD.aporte-fl.USD.pago-fl.USD.retiro;
  return `
  <div class="row between" style="margin-bottom:14px">

AFTER.resumen = ()=>{
  const weeks=[]; const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=11;i>=0;i--){ const s=new Date(d); s.setDate(d.getDate()-7*i); weeks.push(s.toISOString().slice(0,10)); }
  const inc=weeks.map(()=>0), out=weeks.map(()=>0);
  S.data.movs.forEach(m=>{
    let idx=-1; for(let i=weeks.length-1;i>=0;i--){ if(m.fecha>=weeks[i]){ idx=i; break; } }
    if(idx<0) return; const v=toUSD(m.monto, m.cuentas?.moneda);
    if(m.tipo==='ingreso') inc[idx]+=v; else if(m.tipo==='pago') out[idx]+=v;
  });
  const cs=getComputedStyle(document.documentElement);
  const c=new Chart($('#chWeeks'),{type:'bar',data:{labels:weeks.map(w=>fdate(w).slice(0,5)),datasets:[
    {label:'Ingresos',data:inc,backgroundColor:cs.getPropertyValue('--s1').trim(),borderRadius:4,maxBarThickness:18},
    {label:'Pagos',data:out,backgroundColor:cs.getPropertyValue('--s2').trim(),borderRadius:4,maxBarThickness:18}]},
    options:{maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:x=>`${x.dataset.label}: ${fmt0(x.raw,'USD')}`}}},
      scales:{x:{grid:{display:false},ticks:{color:cs.getPropertyValue('--muted').trim()}},y:{grid:{color:cs.getPropertyValue('--border').trim()},border:{display:false},ticks:{color:cs.getPropertyValue('--muted').trim(),callback:v=>fmt0(v)}}}}});
  charts.push(c);
};

function openForm(tbl, id=null, preset={}){

  const fields=F.f();

    const v=rec?.[k]; const r=req?'required':'';
    let h;
    if(t==='sel') h=`<select name="${k}" ${r}><option value="">${req?'Elegir…':'—'}</option>${(opts||[]).map(([ov,ol])=>`<option value="${esc(ov)}" ${String(v)===String(ov)?'selected':''}>${esc(ol)}</option>`).join('')}</select>`;

    else if(t==='bool') h=`<select name="${k}"><option value="true" ${v!==false?'selected':''}>Sí</option><option value="false" ${v===false?'selected':''}>No</option></select>`;
    else if(t==='area') h=`<textarea name="${k}" rows="3">${esc(v??'')}</textarea>`;
    else h=`<input name="${k}" type="${t==='num'?'number':t==='date'?'date':'text'}" ${t==='num'?'step="any"':''} value="${esc(v??'')}" ${r}>`;
    return `<label class="f ${full||t==='area'?'full':''}" data-k="${k}">${l}${req?' *':''}${h}</label>`;
  };

    <form id="frm" class="fgrid">${fields.map(input).join('')}

    if(tbl==='movimientos'){ const t=frm.tipo.value; vis('cliente_id',t==='ingreso'); vis('proveedor_id',t==='pago'); vis('socio_id',t==='aporte'||t==='retiro'); }

    if(tbl==='stock_movimientos'){ const t=frm.tipo.value; vis('cliente_id',t==='salida'); vis('proveedor_id',t==='entrada'); }
  };
  const vis=(k,on)=>{ const el=frm.querySelector(`[data-k="${k}"]`); if(el){ el.classList.toggle('hidden',!on); if(!on) el.querySelector('select,input').value=''; } };
  frm.addEventListener('change',toggle); toggle();
  frm.onsubmit=async e=>{
    e.preventDefault(); const row={};
    fields.forEach(([k,,t])=>{ let v=frm[k].value; if(v===''){ row[k]=null; return; } if(t==='num') v=Number(v); if(t==='bool') v=v==='true'; if(t==='sel'&&/_id$/.test(k)) v=Number(v); row[k]=v; });

    const {error}=await q; if(error){ $('#frmMsg').textContent=error.message; return; }
    closeModal(); toast('Guardado'); refresh();
  };
}

const norm = s => String(s??'').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
function parseNum(v){ if(v===''||v==null) return null; if(typeof v==='number') return v; let s=String(v).replace(/[^\d,.\-]/g,'');
  if(s.includes(',')&&s.includes('.')) s = s.lastIndexOf(',')>s.lastIndexOf('.') ? s.replace(/\./g,'').replace(',','.') : s.replace(/,/g,'');
  else if(s.includes(',')) s=s.replace(',','.'); const n=Number(s); return isNaN(n)?NaN:n; }
function parseDate(v){ if(!v) return null; if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})$/); if(m){ const y=m[3].length===2?'20'+m[3]:m[3]; return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  return 'x'; }
async function readFile(file){
  const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true});
  const want=norm(IMP.type); const sh=wb.SheetNames.find(n=>norm(n)===want)||wb.SheetNames[0];
  const raw=XLSX.utils.sheet_to_json(wb.Sheets[sh],{defval:''});
  IMP.rows=raw.map(r=>{ const o={}; Object.entries(r).forEach(([k,v])=>o[norm(k)]=v); return o; }).filter(r=>Object.values(r).some(v=>v!==''&&v!=null));
  validateImport(); render(); toast(`Hoja "${sh}": ${IMP.rows.length} filas`);
}
const findBy=(arr,k,v)=>arr.find(x=>norm(x[k])===norm(v));
function validateImport(){
  const T=IMP.type, D=S.data; IMP.errors=[]; IMP.ready=[];
  IMP.rows.forEach((r,i)=>{ const n=i+2, err=m=>IMP.errors.push(`Fila ${n}: ${m}`); let o;
    try{
    if(T==='movimientos'){
      const c=findBy(D.cuentas,'nombre',r.cuenta); if(!c) return err(`cuenta "${r.cuenta}" no existe`);
      const tipo=norm(r.tipo); if(!['ingreso','pago','aporte','retiro'].includes(tipo)) return err(`tipo "${r.tipo}" inválido (ingreso/pago/aporte/retiro)`);
      const monto=parseNum(r.monto); if(!(monto>0)) return err('monto inválido');
      const fecha=parseDate(r.fecha); if(!fecha||fecha==='x') return err('fecha inválida');
      let socio_id=null; if(r.socio){ const s=findBy(D.socios,'nombre',r.socio); if(!s) return err(`socio "${r.socio}" no existe`); socio_id=s.id; }
      o={fecha,cuenta_id:c.id,tipo,monto,categoria:r.categoria||null,descripcion:r.descripcion||null,comprobante:r.comprobante?String(r.comprobante):null,socio_id,_cliente:r.cliente||null,_proveedor:r.proveedor||null};
    } else if(T==='documentos'){
      const ent=norm(r.entidad); if(!['cliente','proveedor'].includes(ent)) return err('entidad debe ser cliente o proveedor');
      if(!r.nombre) return err('falta nombre'); const tipo=norm(r.tipo)||'factura'; if(!['factura','nota_credito','saldo_inicial','ajuste'].includes(tipo)) return err(`tipo "${r.tipo}" inválido`);
      const mon=String(r.moneda||'').toUpperCase().trim(); if(!['UYU','USD'].includes(mon)) return err('moneda debe ser UYU o USD');
      const monto=parseNum(r.monto); if(monto==null||isNaN(monto)) return err('monto inválido');
      const fecha=parseDate(r.fecha); if(!fecha||fecha==='x') return err('fecha inválida'); const venc=parseDate(r.vencimiento); if(venc==='x') return err('vencimiento inválido');
      o={fecha,vencimiento:venc,entidad:ent,tipo,numero:r.numero?String(r.numero):null,moneda:mon,monto,descripcion:r.descripcion||null,[ent==='cliente'?'_cliente':'_proveedor']:r.nombre};
    } else if(T==='productos'){
      if(!r.sku||!r.nombre) return err('sku y nombre obligatorios');
      o={sku:String(r.sku).trim(),nombre:r.nombre,categoria:r.categoria||null,unidad:r.unidad||'un',costo:parseNum(r.costo)||0,moneda_costo:String(r.moneda_costo||'USD').toUpperCase(),stock_minimo:parseNum(r.stock_minimo)||0};
    } else if(T==='stock'){
      const p=D.productos.find(x=>String(x.sku).trim().toLowerCase()===String(r.sku).trim().toLowerCase()); if(!p) return err(`SKU "${r.sku}" no existe (importá productos primero)`);
      const tipo=norm(r.tipo); if(!['entrada','salida','ajuste'].includes(tipo)) return err('tipo debe ser entrada/salida/ajuste');
      const cant=parseNum(r.cantidad); if(cant==null||isNaN(cant)) return err('cantidad inválida'); const fecha=parseDate(r.fecha)||today(); if(fecha==='x') return err('fecha inválida');
      o={fecha,producto_id:p.id,tipo,cantidad:cant,costo_unitario:parseNum(r.costo_unitario),referencia:r.referencia?String(r.referencia):null};
    } else if(T==='clientes'||T==='proveedores'){
      if(!r.nombre) return err('falta nombre'); if(findBy(D[T],'nombre',r.nombre)) return err(`"${r.nombre}" ya existe (se omite)`);
      o={nombre:String(r.nombre).trim(),rut:r.rut?String(r.rut):null,contacto:r.contacto||null,telefono:r.telefono?String(r.telefono):null,email:r.email||null,notas:r.notas||null};
    } else if(T==='oportunidades'){
      if(!r.empresa) return err('falta empresa'); const et=norm(r.etapa)||'prospecto'; if(!ETAPAS.some(([k])=>k===et)) return err(`etapa "${r.etapa}" inválida`);
      const fp=parseDate(r.fecha_proximo); if(fp==='x') return err('fecha_proximo inválida');
      o={empresa:r.empresa,contacto:r.contacto||null,telefono:r.telefono?String(r.telefono):null,email:r.email||null,producto:r.producto||null,monto_estimado:parseNum(r.monto_estimado),
        moneda:String(r.moneda||'USD').toUpperCase(),etapa:et,probabilidad:parseNum(r.probabilidad)??20,responsable:r.responsable||null,proximo_paso:r.proximo_paso||null,fecha_proximo:fp,notas:r.notas||null};
    } else if(T==='tipo_cambio'){
      const f=parseDate(r.fecha), v=parseNum(r.usd_uyu); if(!f||f==='x'||!(v>0)) return err('fecha o valor inválido'); o={fecha:f,usd_uyu:v};
    }
    IMP.ready.push(o);
    }catch(e){ err(e.message); }
  });
}
async function ensureEntities(tbl, names){
  const D=S.data; const miss=[...new Set(names.filter(Boolean).map(n=>String(n).trim()))].filter(n=>!findBy(D[tbl],'nombre',n));
  if(miss.length){ const {data,error}=await sb.from(tbl).insert(miss.map(nombre=>({nombre}))).select(); if(error) throw error; D[tbl]=D[tbl].concat(data); }
  return n => n ? findBy(D[tbl],'nombre',n)?.id : null;
}
async function doImport(){
  const T=IMP.type; let rows=IMP.ready.map(r=>({...r}));
  try{
    if(T==='movimientos'||T==='documentos'){
      const cl=await ensureEntities('clientes', rows.map(r=>r._cliente)); const pr=await ensureEntities('proveedores', rows.map(r=>r._proveedor));
      rows=rows.map(({_cliente,_proveedor,...r})=>({...r, cliente_id:cl(_cliente)||null, proveedor_id:pr(_proveedor)||null}));
    }
    const tbl={stock:'stock_movimientos'}[T]||T;
    for(let i=0;i<rows.length;i+=500){
      const chunk=rows.slice(i,i+500);
      const q = T==='productos' ? sb.from(tbl).upsert(chunk,{onConflict:'sku'}) : T==='tipo_cambio' ? sb.from(tbl).upsert(chunk) : sb.from(tbl).insert(chunk);
      const {error}=await q; if(error) throw error;
    }
    toast(`✔ ${rows.length} filas importadas`,4000); IMP.rows=null; await refresh();
  }catch(e){ toast('Error al importar: '+e.message,7000); }
}
function downloadTemplate(){
  const wb=XLSX.utils.book_new();
  Object.entries(IMPORTS).forEach(([k,v])=>{ const ws=XLSX.utils.aoa_to_sheet([v.cols,...v.ex]); ws['!cols']=v.cols.map(()=>({wch:18})); XLSX.utils.book_append_sheet(wb,ws,k); });
  const ay=[['Hoja','Valores válidos'],['movimientos.tipo','ingreso, pago, aporte, retiro'],['movimientos.cuenta','nombre exacto de la cuenta creada en Bancos'],['movimientos.socio','nombre exacto del socio (solo aportes/retiros)'],
    ['documentos.entidad','cliente, proveedor'],['documentos.tipo','factura, saldo_inicial, nota_credito, ajuste'],['moneda','UYU, USD'],['stock.tipo','entrada, salida, ajuste (ajuste con signo)'],
    ['oportunidades.etapa','prospecto, contactado, cotizado, negociacion, ganada, perdida'],['fechas','AAAA-MM-DD o DD/MM/AAAA']];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ay),'ayuda');
  XLSX.writeFile(wb,'plantilla_surix_uy.xlsx');
}
function exportXLSX(kind){
  const D=S.data; let rows=[];
  if(kind==='movimientos') rows=D.movs.map(m=>({fecha:m.fecha,cuenta:m.cuentas?.nombre,moneda:m.cuentas?.moneda,tipo:m.tipo,monto:+m.monto,categoria:m.categoria,cliente:m.clientes?.nombre,proveedor:m.proveedores?.nombre,socio:m.socios?.nombre,descripcion:m.descripcion,comprobante:m.comprobante,cargado_por:m.cargado_por}));
  if(kind==='stock') rows=D.vstock.map(p=>({sku:p.sku,nombre:p.nombre,categoria:p.categoria,stock:+p.stock,minimo:+p.stock_minimo,costo:+p.costo,moneda:p.moneda_costo}));
  if(kind==='oportunidades') rows=D.opps.map(({id,created_at,...o})=>o);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),kind); XLSX.writeFile(wb,`surix_uy_${kind}_${today()}.xlsx`);
}

boot();
